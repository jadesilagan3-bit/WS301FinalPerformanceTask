<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Student Registration Form</h1>
        <p>Please fill out the form below.</p>

        <form id="registrationForm"
              data-form-name="Student Registration"
              data-status="incomplete">

            <label for="studentId">Student ID</label>
            <input type="text" id="studentId" data-label="Student ID">
            <small id="studentIdError" class="error-message"></small>

            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" data-label="Full Name">
            <small id="fullNameError" class="error-message"></small>

            <label for="email">Email</label>
            <input type="text" id="email" data-label="Email">
            <small id="emailError" class="error-message"></small>

            <label for="phone">Phone Number</label>
            <input type="text" id="phone"
                   placeholder="09XXXXXXXXX" data-label="Phone Number">
            <small id="phoneError" class="error-message"></small>

            <label for="birthDate">Date of Birth</label>
            <input type="date" id="birthDate" data-label="Date of Birth">
            <small id="birthDateError" class="error-message"></small>

            <label for="gender">Gender</label>
            <select id="gender" data-label="Gender">
                <option value="">Select Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Prefer not to say">Prefer not to say</option>
            </select>
            <small id="genderError" class="error-message"></small>

            <label for="program">Program</label>
            <select id="program" data-label="Program">
                <option value="">Select Program</option>
                <option value="BSIT">BS Information Technology</option>
                <option value="BSCS">BS Computer Science</option>
                <option value="BSIS">BS Information Systems</option>
                <option value="BSEd">Bachelor of Secondary Education</option>
            </select>
            <small id="programError" class="error-message"></small>

            <label for="yearLevel">Year Level</label>
            <select id="yearLevel" data-label="Year Level">
                <option value="">Select Year Level</option>
                <option value="1st Year">1st Year</option>
                <option value="2nd Year">2nd Year</option>
                <option value="3rd Year">3rd Year</option>
                <option value="4th Year">4th Year</option>
            </select>
            <small id="yearLevelError" class="error-message"></small>

            <label for="password">Password</label>
            <input type="password" id="password" data-label="Password">
            <small id="passwordError" class="error-message"></small>

            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword"
                   data-label="Confirm Password">
            <small id="confirmPasswordError" class="error-message"></small>

            <button type="button" id="showPassword">
                Show / Hide Password
            </button>

            <label for="address">Address</label>
            <textarea id="address" rows="3" data-label="Address"></textarea>
            <small id="addressError" class="error-message"></small>

            <div class="agreement">
                <input type="checkbox" id="agreement">
                <label for="agreement">
                    I agree that my information is correct.
                </label>
            </div>
            <small id="agreementError" class="error-message"></small>

            <div class="buttons">
                <button type="submit">Register</button>
                <button type="reset" class="reset-button">Reset</button>
            </div>

            <p id="successMessage"></p>

        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
